# Switches on the extensions that are registered in META-INF/services/org.junit.jupiter.api.extension.Extension. The only one is
# PinnedTestZone (Phase 14a): it pins the JVM's time zone once, before any test class, so the result of a test does not depend on the
# machine it runs on. No jar of the test classpath registers an extension of its own, so nothing else is switched on by this line.
junit.jupiter.extensions.autodetection.enabled=true
