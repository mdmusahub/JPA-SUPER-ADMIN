name: Docs

# The documentation site is built and published ONLY when the maintainer presses "Run workflow" on the Actions page (a manual
# trigger). It never runs on a push, a pull request, a tag or a schedule (Phase 14b, D-141). `mkdocs build --strict` fails on a
# broken link or a page that is not in the navigation, so a bad page never reaches the site.
#
# One-time setup by the maintainer: Settings, Pages, Source = "GitHub Actions". The first run after that publishes the site.

on:
  workflow_dispatch:

# Least privilege: the build only reads the repository. The deploy job asks for the two extra permissions it needs, and only it.
permissions:
  contents: read

# One publication at a time, and a running one is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs. The comment shows the release each SHA belongs to.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # docs/requirements.txt pins mkdocs, mkdocs-material and every package they need, each with the hashes of its files: pip
      # refuses anything else (--require-hashes), and --no-deps stops it from fetching a package that is not on the list.
      - name: Install the pinned documentation tools
        run: python -m pip install --require-hashes --no-deps -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
