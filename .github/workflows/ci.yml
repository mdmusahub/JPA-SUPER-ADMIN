name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository contents.
permissions:
  contents: read

# Cancel a run when a newer commit arrives on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      # Actions are pinned to full commit SHAs. The comment shows the release each SHA belongs to.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      # The host-check project is outside the reactor (D-26): it depends on the published starter, so the snapshot
      # has to be in the local Maven repository before it can build. `verify` above does not install, so install the
      # reactor (no tests: they just ran), then build and test host-check against it. This proves the library works
      # for a host with entirely different entities and only the starter added.
      - name: Install the starter and run the host-check project
        run: |
          mvn -B -DskipTests install
          mvn -B -f host-check/pom.xml verify
