name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository contents.
permissions:
  contents: read

# Cancel a run when a newer commit arrives on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The build runs the Testcontainers tests (PostgreSQL and MySQL) and every sample-app test class in its own JVM (D-128, D-130):
    # 19 minutes on a 12-core laptop for `verify` alone, plus the install and host-check, and a hosted runner has 4 cores. 20 minutes
    # was the limit before those were added.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      # Actions are pinned to full commit SHAs. The comment shows the release each SHA belongs to.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # A skipped test is not a passed test. This runner already has Docker (the Testcontainers tests on PostgreSQL and MySQL) and
      # Google Chrome (the real-browser tests), so a missing one must fail the build here and not skip silently. On a laptop the
      # same tests are skipped with their reason (D-128, D-129). No browser is downloaded: the runner's own Chrome is used.
      - name: Build and test
        env:
          JPA_ADMIN_REQUIRE_ENGINES: "true"
          JPA_ADMIN_REQUIRE_BROWSER: "true"
        run: mvn -B clean verify

      # What ran, what was skipped and why, read from the surefire reports (the script prints counts and skip reasons only, which hold
      # no data; the test output itself goes to files in sample-app, so the public log never holds a row value, D-130).
      - name: Report what ran and what was skipped
        if: always()
        run: bash .github/scripts/report-tests.sh

      # The host-check project is outside the reactor (D-26): it depends on the published starter, so the snapshot
      # has to be in the local Maven repository before it can build. `verify` above does not install, so install the
      # reactor (no tests: they just ran), then build and test host-check against it. This proves the library works
      # for a host with entirely different entities and only the starter added.
      - name: Install the starter and run the host-check project
        run: |
          mvn -B -DskipTests install
          mvn -B -f host-check/pom.xml verify
