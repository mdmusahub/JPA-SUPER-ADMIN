<!DOCTYPE html>
<html lang="en"
      th:fragment="layout(pageTitle, content, signOut, searchId)"
      th:attr="data-theme-default=${#strings.toLowerCase(chrome.theme)}">
<!--/*
  The shell of every page except the sign-in page: sidebar, top bar, message area and a slot for the page's own
  <main>. A page uses it by replacing its own <html> element:

    <html th:replace="~{jpa-admin/layout :: layout('Dashboard', ~{::main}, true, null)}">

  pageTitle  the text before the console title in the browser tab (escaped on output)
  content    the page's <main id="main"> element
  signOut    whether the visitor is signed in, so the sidebar shows the user chip with Sign out
  searchId   the id of the page's search box, or null when the page has none: a list passes it so that a keyboard user gets a
             second skip link, "Skip to search", before the sidebar. It is a plain link and needs no script; the "/" key that
             does the same (shortcuts.js) is an enhancement (Phase 13, D-123)

  The template reads only chrome (PageChrome) and view (the page's record) (UI-12). No inline script, style or handler.
*/-->
<head>
  <th:block th:replace="~{jpa-admin/fragments/head :: assets}"></th:block>
  <title th:text="${pageTitle + ' | ' + chrome.title}">Page | JPA Admin</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <a class="skip-link" th:if="${searchId != null}" th:href="'#' + ${searchId}">Skip to search</a>

  <div class="shell" data-shell data-nav-open="false">
    <th:block th:replace="~{jpa-admin/fragments/sidebar :: sidebar(${signOut})}"></th:block>
    <div class="shell-backdrop" data-nav-close></div>

    <div class="main-column">
      <th:block th:replace="~{jpa-admin/fragments/topbar :: topbar(${signOut})}"></th:block>
      <th:block th:replace="~{jpa-admin/fragments/toast :: toasts}"></th:block>
      <th:block th:replace="${content}"></th:block>
    </div>
  </div>

  <script th:src="@{${chrome.basePath} + '/assets/js/nav.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/shortcuts.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/filters.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/views.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/bulk.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/form-guard.js'}" defer></script>
  <script th:src="@{${chrome.basePath} + '/assets/js/uploader.js'}" defer></script>
</body>
</html>
