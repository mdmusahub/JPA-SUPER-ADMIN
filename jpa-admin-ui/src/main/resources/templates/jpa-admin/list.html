<!DOCTYPE html>
<html lang="en"
      th:replace="~{jpa-admin/layout :: layout(${view.entity.plural}, ~{::main}, true)}">
<!--/*
  One entity's list page (task U2): the heading with the record count, a search form, the table, the paging and the
  empty state. It reads only chrome and view (a ListView), and it prints the links the record gives it: it builds none
  of the sort, page, page-size or export links itself (D-28).

  Search and the filters are ONE plain GET form, sort and paging are plain links, so the page works without JavaScript
  and the state (search, filters, sort, page, size) is always in the address: a reload or Back shows the same page
  (UI-10). The form keeps the current sort and page size in hidden fields and starts again at the first page, which is
  the only page that is always there for a new search or a new filter. Pressing Enter in the search box also sends the
  filter controls, so a search never drops the filters. The panel is a details element, so it opens and closes without
  scripts; filters.js only leaves empty controls out of the address.

  The active filters are chips (view.filters.chips) with a remove link and a clear-all link, both built by the backend
  (D-28); the template prints them. The names of the controls are derived from the key and the kind: filter.key for a
  single value, filter.key.min and .max for a number range, filter.key.from and .to for a date range.

  Actions that do not exist yet are simply not in the record: nothing here is a disabled button. "New record" and the
  export button appear only when view.actions says so.

  Bulk delete (task U4): when view.actions.canBulkDelete is true the table has a checkbox column and sits, with the bulk
  bar, in a POST form of its own (view.actions.bulkDeleteHref; the address carries the list state, so the answer returns
  to this list). The first column of each row (the identifier) links to the record's detail page and a relation cell links
  to the related record: both links come from the backend. A message after a delete arrives in chrome.flash.
*/-->
<body>
<main id="main" class="content" tabindex="-1">
  <header class="list-header">
    <span class="list-mark" aria-hidden="true">
      <th:block th:replace="~{jpa-admin/fragments/icons :: entity-icon(${view.entity.icon})}"></th:block>
    </span>
    <div class="list-title">
      <h1 class="page-title" th:text="${view.entity.plural}">Articles</h1>
      <p class="muted list-count"
         th:text="${#numbers.formatInteger(view.paging.total, 1, 'COMMA')} + (${view.paging.total == 1} ? ' record' : ' records')">0 records</p>
    </div>
    <div class="list-actions" th:if="${view.actions.canExport or view.actions.canCreate}">
      <a class="btn" th:if="${view.actions.canExport}" th:href="@{${view.actions.exportHref}}">Export CSV</a>
      <a class="btn btn-primary" th:if="${view.actions.canCreate}"
         th:href="@{${chrome.basePath} + '/' + ${chrome.activeEntity} + '/new'}">New record</a>
    </div>
  </header>

  <form class="list-toolbar" method="get" role="search" data-filter-form
        th:action="@{${chrome.basePath} + '/' + ${chrome.activeEntity}}">
    <div class="toolbar-row">
    <div class="search-field">
      <label class="visually-hidden" for="list-search"
             th:text="'Search ' + ${#strings.toLowerCase(view.entity.plural)}">Search articles</label>
      <th:block th:replace="~{jpa-admin/fragments/icons :: search}"></th:block>
      <input id="list-search" class="search-input" type="search" name="q" maxlength="100" autocomplete="off"
             th:value="${view.search}" th:placeholder="'Search ' + ${#strings.toLowerCase(view.entity.plural)}">
    </div>
    <input type="hidden" name="sort" th:if="${view.sort != null}" th:value="${view.sort}">
    <input type="hidden" name="dir" th:if="${view.sort != null}" th:value="${view.dir}">
    <input type="hidden" name="size" th:value="${view.paging.size}">
    <button type="submit" class="btn">Search</button>
    <a class="btn btn-quiet" th:if="${!view.search.isEmpty()}"
       th:href="@{${chrome.basePath} + '/' + ${chrome.activeEntity}}"
       th:text="${view.filters.chips.isEmpty()} ? 'Clear search' : 'Clear search and filters'">Clear search</a>
    </div>
    <th:block th:replace="~{jpa-admin/fragments/filter-panel :: panel}"></th:block>
  </form>

  <th:block th:replace="~{jpa-admin/fragments/filter-chips :: chips}"></th:block>

  <section class="card table-card" th:if="${!view.rows.isEmpty()}">
    <!--/* The bulk form is a POST form of its own around the table and the bar: never inside the GET form above, and the
           GET form never inside it, so a filter request never carries ids and a delete never carries filter controls. */-->
    <form th:if="${view.actions.canBulkDelete}" class="bulk-form" method="post" data-bulk-form
          th:action="@{${view.actions.bulkDeleteHref}}">
      <input type="hidden" th:name="${chrome.csrf.parameterName}" th:value="${chrome.csrf.token}">
      <th:block th:replace="~{jpa-admin/fragments/table :: table}"></th:block>
      <th:block th:replace="~{jpa-admin/fragments/bulk-bar :: bar}"></th:block>
    </form>
    <!--/* th:replace runs before th:unless, so the condition sits on a block of its own. */-->
    <th:block th:unless="${view.actions.canBulkDelete}">
      <th:block th:replace="~{jpa-admin/fragments/table :: table}"></th:block>
    </th:block>
    <th:block th:replace="~{jpa-admin/fragments/pager :: pager}"></th:block>
  </section>

  <section class="card empty-state" th:if="${view.rows.isEmpty()}">
    <span class="empty-state-mark"><th:block th:replace="~{jpa-admin/fragments/icons :: table}"></th:block></span>
    <h2 th:if="${view.empty.reason.name() == 'NO_MATCHES'}">No matching records</h2>
    <h2 th:if="${view.empty.reason.name() != 'NO_MATCHES'}">No records yet</h2>
    <p th:text="${view.empty.hint}">What to do next.</p>
    <a class="btn" th:if="${view.empty.reason.name() == 'NO_MATCHES' and view.filters.clearAllHref != null}"
       th:href="@{${view.filters.clearAllHref}}">Clear all filters</a>
    <a class="btn" th:if="${view.empty.reason.name() == 'NO_MATCHES' and !view.search.isEmpty()}"
       th:href="@{${chrome.basePath} + '/' + ${chrome.activeEntity}}"
       th:text="${view.filters.chips.isEmpty()} ? 'Clear search' : 'Clear search and filters'">Clear search</a>
    <a class="btn btn-primary" th:if="${view.empty.reason.name() == 'NO_RECORDS' and view.actions.canCreate}"
       th:href="@{${chrome.basePath} + '/' + ${chrome.activeEntity} + '/new'}">Create the first one</a>
  </section>
</main>
</body>
</html>
