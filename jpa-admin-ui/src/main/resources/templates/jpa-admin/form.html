<!DOCTYPE html>
<html lang="en"
      th:replace="~{jpa-admin/layout :: layout(${view.title}, ~{::main}, true)}">
<!--/*
  The create and edit form (task U5). One template for both: view.mode says which. It reads only chrome and view (a
  FormView) and prints the links the record gives it (D-28, D-74): the form posts to view.actionHref (the collection for a
  create, the record for an edit; for an entity with a @Version the address also carries the version the form was opened
  with, so a stale form is refused) and Cancel leads to view.cancelHref. It builds no link and no query string itself.

  Every input is rendered by fragments/field-input.html. The form is a plain POST form with the CSRF token, so it works
  without script. A refused save shows the same form again with what the visitor typed and a sentence next to each field
  that was wrong (linked to its input with aria-describedby), and a summary at the top (role alert) that links to each of
  them. A masked input never has a value (SEC-1).

  "Cancel" is a details element whose panel asks "Discard your changes?" and holds the real link (UI-5, the pattern of the
  delete question): it needs no script. form-guard.js only adds the browser's warning when the visitor leaves a changed
  form by another way, goes straight to the list when nothing was changed, and moves focus to the first error.
*/-->
<body>
<main id="main" class="content" tabindex="-1">
  <header class="list-header">
    <div class="list-title">
      <p class="muted detail-kicker" th:text="${view.mode.name() == 'EDIT'} ? ${view.entityLabel} + ' #' + ${view.recordId} : ${view.entityLabel}">Article</p>
      <h1 class="page-title" th:text="${view.title}">New article</h1>
    </div>
  </header>

  <form class="card form-card" method="post" data-form-guard th:action="@{${view.actionHref}}">
    <input type="hidden" th:name="${chrome.csrf.parameterName}" th:value="${chrome.csrf.token}">

    <div th:if="${!view.formErrors.isEmpty()}" class="form-summary" role="alert" tabindex="-1" autofocus data-form-summary>
      <p class="form-summary-title" th:each="message : ${view.formErrors}" th:text="${message}">2 fields need your attention.</p>
      <ul class="form-summary-list">
        <th:block th:each="field : ${view.fields}">
          <li th:if="${field.error != null}">
            <a th:href="'#f-' + ${field.key}" th:text="${field.label} + ': ' + ${field.error}">Title: Enter a value.</a>
          </li>
        </th:block>
      </ul>
    </div>

    <div class="form-grid">
      <th:block th:each="field : ${view.fields}">
        <th:block th:replace="~{jpa-admin/fragments/field-input :: input(${field})}"></th:block>
      </th:block>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"
              th:text="${view.mode.name() == 'EDIT'} ? 'Save changes' : 'Create record'">Save changes</button>
      <details class="confirm" data-form-cancel>
        <summary class="btn">Cancel</summary>
        <div class="confirm-panel">
          <p>Discard your changes? Anything you typed on this page is lost.</p>
          <a class="btn btn-danger" data-form-discard th:href="@{${view.cancelHref}}">Yes, discard changes</a>
        </div>
      </details>
    </div>
  </form>
</main>
</body>
</html>
