<!DOCTYPE html>
<html lang="en"
      th:replace="~{jpa-admin/layout :: layout(${chrome.breadcrumbs[chrome.breadcrumbs.size() - 1].label}, ~{::main}, true)}">
<!--/*
  One entity's page, until the table arrives (Phase 4, task U2). It shows the shell with the entity marked in the
  sidebar and says plainly that the table is not available yet; the same sentence is also in the message area, where
  the controller put it.

  This is the one page with no record of its own: it has nothing to show. Its heading is the last breadcrumb, which
  the controller set to the entity's label. Task U2 replaces the whole file with the real list page.
*/-->
<body>
<main id="main" class="content" tabindex="-1">
  <h1 class="page-title" th:text="${chrome.breadcrumbs[chrome.breadcrumbs.size() - 1].label}">Entity</h1>

  <section class="card empty-state">
    <span class="empty-state-mark"><th:block th:replace="~{jpa-admin/fragments/icons :: table}"></th:block></span>
    <h2>This table view is not available yet</h2>
    <p>The console has found this entity and counted its records, but it cannot list them yet. Browsing, searching,
      sorting and paging arrive in the next version.</p>
    <a class="btn" th:href="@{${chrome.basePath}}">Go to dashboard</a>
  </section>
</main>
</body>
</html>
