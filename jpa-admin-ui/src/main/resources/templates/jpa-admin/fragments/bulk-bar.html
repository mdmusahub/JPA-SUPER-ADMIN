<!DOCTYPE html>
<html>
<body>
<!--/*
  The bulk bar under the table: how many rows are selected, and "Delete selected" with its confirmation. It is the last
  thing inside the bulk form of list.html (a POST form with the CSRF token, whose address is view.actions.bulkDeleteHref
  and carries the list state, so the answer returns to the same list).

  Works without script: the bar is simply there, the row checkboxes are plain checkboxes, and "Delete selected" is a
  details element whose panel holds the question and the submit button (UI-5: a destructive action always asks). With
  script (bulk.js, which only enhances) the bar floats at the bottom of the screen, appears only while something is
  selected, and shows the count. The count in the text is script-only (it would be wrong without script), so the
  no-script visitor gets a sentence instead.

  Selection is per page: the header checkbox selects only the rows of this page, and a new page, search, filter or sort
  starts with nothing selected. The server deletes at most 100 records per request (the largest page), all or none.
*/-->
<div th:fragment="bar" class="bulk-bar" data-bulk-bar data-empty role="group" aria-label="Bulk actions">
  <p class="bulk-status" aria-live="polite">
    <span class="js-only"><span data-bulk-count>0</span> selected</span>
    <span class="no-js-only">Tick the rows to delete, then choose Delete selected.</span>
  </p>
  <details class="confirm confirm-up" data-bulk-confirm>
    <summary class="btn btn-danger">Delete selected</summary>
    <div class="confirm-panel">
      <p>
        Delete <span class="js-only">the <strong data-bulk-count>0</strong> selected</span>
        <span class="no-js-only">the selected</span>
        <span th:text="${#strings.toLowerCase(view.entity.plural)}">articles</span>?
        This cannot be undone, and if one of them cannot be deleted, none is.
      </p>
      <button type="submit" class="btn btn-danger">Yes, delete selected</button>
    </div>
  </details>
</div>
</body>
</html>
