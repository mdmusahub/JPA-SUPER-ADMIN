<!DOCTYPE html>
<html>
<body>
<!--/*
  The visible part of one upload field (task U6, D-95). It sits OUTSIDE the record form, after it, because it holds a form of its
  own: a file needs a multipart form, and HTML does not allow a form inside a form. It reads only the FormView.Field of an
  UPLOAD field, `chrome` and `view`, and builds no link: the address of the stored file is the field's value, which the backend
  made and checked (D-97), and the upload endpoint is the fixed route under the base path.

  What the field carries (FormView.Field, no contract change, D-96): value = the stored or just-uploaded address, or null;
  uploadTicket = the signed ticket for this field; help = the sentence that says what it takes; options = exactly two entries,
  ("accept", "image/png,image/jpeg") and ("maxBytes", "2097152"), the advisory limits that uploader.js shows early. The server
  decides again (UPL-1, UPL-2). The entity is chrome.activeEntity.

  Without script it is a plain form: choose a file, "Upload file", the page is shown again with the new address in the field
  (the page warns that text typed above and not saved is lost). The current file can be removed with a checkbox that belongs to
  the record form (form="record-form"). With script (uploader.js) the same markup becomes an uploader: drag and drop, progress,
  preview, "Replace file" and "Remove file" buttons, and the record form's Save button waits while a file is on its way.

  A picture is shown as an image only when its address ends in .png, .jpg, .gif or .webp (never .svg: it is never stored, D-91);
  anything else is a link. Both are printed with th:src, th:href and th:text, so the address and the label are escaped (SEC-9);
  an image always has alternative text, the field's label.
*/-->
<section th:fragment="uploader(field)" class="upload-field" data-upload data-state="idle"
         th:classappend="${field.error != null} ? 'field-invalid'"
         th:attr="data-upload-key=${field.key},
                  data-accept=${field.options.size() > 0 ? field.options[0].label : ''},
                  data-max-bytes=${field.options.size() > 1 ? field.options[1].label : ''},
                  data-csrf-header=${chrome.csrf.headerName}"
         th:with="fileValue=${field.value},
                  isImage=${field.value != null and (#strings.endsWith(field.value, '.png') or #strings.endsWith(field.value, '.jpg') or #strings.endsWith(field.value, '.gif') or #strings.endsWith(field.value, '.webp'))}">
  <h2 class="upload-title">
    <label th:for="'f-' + ${field.key}">
      <span th:text="${field.label}">Photo</span>
      <span class="required-mark" th:if="${field.required}" aria-hidden="true">*</span>
      <span class="visually-hidden" th:if="${field.required}"> (required)</span>
    </label>
  </h2>
  <p class="field-help" th:if="${field.help != null}" th:id="'h-' + ${field.key}" th:text="${field.help}">Accepts PNG image, up to 5 MB.</p>

  <div class="upload-current" data-upload-current>
    <th:block th:if="${fileValue != null}">
      <img class="upload-preview" th:if="${isImage}" th:src="@{${fileValue}}" th:alt="${field.label}" data-upload-preview>
      <a class="cell-link cell-file" th:unless="${isImage}" th:href="@{${fileValue}}" data-upload-link>
        <th:block th:replace="~{jpa-admin/fragments/icons :: file}"></th:block>
        <span th:text="${field.label}">Contract</span>
      </a>
    </th:block>
    <p class="upload-empty" th:if="${fileValue == null}" data-upload-empty>No file yet.</p>
  </div>

  <p class="upload-remove" data-upload-remove-check th:hidden="${fileValue == null}">
    <input type="checkbox" value="true" form="record-form" th:id="'r-' + ${field.key}" th:name="${field.key} + '-remove'">
    <label th:for="'r-' + ${field.key}">Remove the current file when the record is saved</label>
  </p>

  <form class="upload-form" method="post" enctype="multipart/form-data" th:action="@{${chrome.basePath} + '/uploads'}" data-upload-form>
    <input type="hidden" th:name="${chrome.csrf.parameterName}" th:value="${chrome.csrf.token}">
    <input type="hidden" name="entity" th:value="${chrome.activeEntity}">
    <input type="hidden" name="field" th:value="${field.key}">
    <input type="hidden" name="ticket" th:value="${field.uploadTicket}">
    <input type="hidden" name="record" th:if="${view.recordId != null}" th:value="${view.recordId}">
    <div class="upload-drop" data-upload-drop>
      <input class="upload-input" type="file" name="file" th:id="'f-' + ${field.key}" data-upload-input
             th:attr="accept=${field.options.size() > 0 ? field.options[0].label : null},
                      aria-describedby=${field.help != null ? (field.error != null ? 'h-' + field.key + ' e-' + field.key : 'h-' + field.key) : (field.error != null ? 'e-' + field.key : null)},
                      aria-invalid=${field.error != null} ? 'true'">
      <button type="submit" class="btn" data-upload-submit>Upload file</button>
    </div>
    <p class="field-help upload-note" data-upload-note>Sending a file reloads this page: anything you typed above and did not save is lost. Save first if you need to.</p>
    <progress class="upload-progress" max="100" value="0" aria-label="Upload progress" hidden data-upload-progress></progress>
    <p class="upload-status" role="status" aria-live="polite" data-upload-status></p>
    <div class="upload-actions" hidden data-upload-actions>
      <button type="button" class="btn" data-upload-replace th:attr="aria-label='Replace the file of ' + ${field.label}">Replace file</button>
      <button type="button" class="btn btn-danger" data-upload-remove th:attr="aria-label='Remove the file of ' + ${field.label}">Remove file</button>
    </div>
  </form>

  <p class="field-error" th:if="${field.error != null}" th:id="'e-' + ${field.key}">
    <span class="visually-hidden">Error: </span><span th:text="${field.error}">The file is not one this console uploaded. Upload it again.</span>
  </p>
</section>
</body>
</html>
