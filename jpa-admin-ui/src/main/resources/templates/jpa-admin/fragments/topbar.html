<!DOCTYPE html>
<html>
<body>
<!--/*
  The sticky top bar: the drawer button (shown on narrow screens when JavaScript runs), the breadcrumbs and the
  theme toggle. Signing out lives in the sidebar's user chip next to the name it signs out, so there is one
  sign-out on the page and no button that has to be explained twice.

  signOut  kept as a parameter: the layout decides with it whether the visitor is signed in, and the sidebar shows
           the user chip. The top bar itself looks the same either way.
*/-->
<header th:fragment="topbar(signOut)" class="topbar">
  <button type="button" class="icon-button nav-toggle" data-nav-toggle aria-label="Open navigation"
          aria-controls="sidebar" aria-expanded="false">
    <th:block th:replace="~{jpa-admin/fragments/icons :: menu}"></th:block>
  </button>

  <th:block th:replace="~{jpa-admin/fragments/breadcrumbs :: crumbs}"></th:block>

  <div class="topbar-spacer"></div>

  <th:block th:replace="~{jpa-admin/fragments/theme-toggle :: toggle}"></th:block>
</header>
</body>
</html>
