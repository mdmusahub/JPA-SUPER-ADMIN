<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1013;--pn:#151a1f;--ink:#edf0f3;--mu:#929ba6;--ln:#262c33;--ac:#2fc08c;--acf:#06150f;--acb:#12372a;--hv:#1d242b;--rd:#ff7b8f;--rdb:#3a1a21;--am:#f0b94d;--amb:#3a2d10;--gy:#a3acb7;--gyb:#222a31;--bar:#2fc08c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1013;--pn:#151a1f;--ink:#edf0f3;--mu:#929ba6;--ln:#262c33;--ac:#2fc08c;--acf:#06150f;--acb:#12372a;--hv:#1d242b;--rd:#ff7b8f;--rdb:#3a1a21;--am:#f0b94d;--amb:#3a2d10;--gy:#a3acb7;--gyb:#222a31;--bar:#2fc08c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.app.col{grid-template-columns:0 1fr}
.app.col aside{display:none}
aside{background:var(--pn);border-right:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--acf);display:grid;place-items:center}
.brand b{display:block;font-size:13px}.brand small{color:var(--mu);font-size:11px}
.sq{display:flex;gap:8px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;color:var(--mu)}
.sq input{border:0;background:none;outline:0;flex:1;min-width:0}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--ln);border-radius:4px;padding:0 4px;color:var(--mu)}
.gh{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--mu);font-size:12px;padding:10px 8px 4px}
.nv{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px}
.nv:hover{background:var(--hv)}.nv.on{background:var(--hv);font-weight:600}
.nv span.c{margin-left:auto;color:var(--mu);font-size:12px}
.me{margin-top:auto;display:flex;gap:9px;align-items:center;padding:8px 6px;border-top:1px solid var(--ln)}
.av{width:26px;height:26px;border-radius:50%;background:var(--acb);color:var(--ac);display:grid;place-items:center;font-size:12px;font-weight:600}
main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--ln);background:var(--pn);position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top .sp{flex:1}
.ib{border:0;background:none;padding:6px;border-radius:7px;display:grid;place-items:center}.ib:hover{background:var(--hv)}
.crumb{color:var(--mu)}.crumb a{cursor:pointer}.crumb a:hover{color:var(--ink)}.crumb b{color:var(--ink);font-weight:500}
.page{padding:22px 24px 90px;max-width:1240px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:0}
.mu{color:var(--mu)}.r{text-align:right}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
.card .k{color:var(--mu);display:flex;justify-content:space-between}
.card .v{font-size:26px;font-weight:650;margin-top:8px}
.card .n{color:var(--mu);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;font-size:12px}.seg button.on{background:var(--hv);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:3px;height:190px;margin-top:16px;border-bottom:1px solid var(--ln)}
.chart i{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:0;opacity:.9}
.chart i:hover{opacity:1;outline:2px solid var(--acb)}
.xl{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:6px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hd .sp{flex:1}
.ico{width:38px;height:38px;border:1px solid var(--ln);border-radius:9px;display:grid;place-items:center;background:var(--pn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:6px 12px}
.btn:hover{background:var(--hv)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acf);font-weight:600}.btn.p:hover{filter:brightness(1.07)}
.btn.d{color:var(--rd)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb .sq{background:var(--pn);width:260px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--hv);border-radius:6px;padding:3px 8px;font-size:12px}
.chip button{border:0;background:none;padding:0;color:var(--mu)}
.fp{display:flex;gap:10px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:12px}
select,.in{border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:6px 9px}
.tw{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-top:1px solid var(--ln)}
th{border-top:0;color:var(--mu);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hv)}tbody tr.sel{background:var(--acb)}
td.r,th.r{text-align:right}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--ln);color:var(--mu);font-size:12px;flex-wrap:wrap}
.th{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--acb);color:var(--ac);font-weight:700;font-size:12px;margin-right:8px;vertical-align:middle}
.bd{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.bd:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bg{background:var(--acb);color:var(--ac)}.ba{background:var(--amb);color:var(--am)}.br{background:var(--rdb);color:var(--rd)}.bn{background:var(--gyb);color:var(--gy)}
.yes{color:var(--ac)}.no{color:var(--mu)}
a.l{color:inherit;text-decoration:underline;text-decoration-color:var(--ln);text-underline-offset:3px;cursor:pointer}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:8}
.det{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.det dt{color:var(--mu);font-size:12px}.det dd{margin:2px 0 0}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fm label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.fm .in,.fm select{width:100%}
.err{color:var(--rd);font-size:12px;margin-top:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
.md{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:20px;max-width:380px;width:calc(100% - 32px)}
.md p{margin:6px 0 16px;color:var(--mu)}.md .a{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:30}
.em{text-align:center;padding:40px;color:var(--mu)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mb{display:none}
@media (max-width:900px){
 .app,.app.col{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;width:260px;z-index:15;transform:translateX(-100%);transition:transform .2s}
 .app.open aside{transform:none;display:flex}.app.col aside{display:flex}
 .cards{grid-template-columns:1fr 1fr}.two,.det,.fm{grid-template-columns:1fr}.page{padding:16px 14px 90px}
 .tb .sq{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
