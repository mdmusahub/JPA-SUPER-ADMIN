# Test-only values. They are fake, they protect nothing, and they exist so the sample app's tests can start the console.
# The sample app's real application.yml deliberately sets no credentials: a host supplies jpa.admin.username and
# jpa.admin.password itself, and the "start without a username" checks need them to be absent.
jpa.admin.username=test-admin
jpa.admin.password=test-only-password-NOT-REAL-1

# Uploads (Phase 9a): the test storage lives under target, so a clean build removes it and no test writes into the source tree.
jpa.admin.storage.default.directory=target/test-uploads
